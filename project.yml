name: Tack
options:
  bundleIdPrefix: app.tack
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
  groupSortPosition: top
  createIntermediateGroups: true
  xcodeVersion: "15.4"

# Locales shipped in v1.0
knownRegions:
  - en
  - es
  - fr
  - de
  - it
  - pt-BR
  - Base

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: KADHS6P8PY
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: "AccentColor"
    ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    ENABLE_PREVIEWS: YES
    OTHER_SWIFT_FLAGS: "-Xfrontend -warn-long-function-bodies=300"

targets:

  # ─── iOS App ───────────────────────────────────────────────────
  Tack:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tack
    dependencies:
      - target: TackWidget
    info:
      path: Tack/Info.plist
      properties:
        CFBundleDisplayName: Tack
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        NSUserActivityTypes:
          - AddTaskIntent
          - CompleteTaskIntent
          - QuickCaptureIntent
        NSHumanReadableCopyright: "© 2026"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tack.ios
        "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution: ENRIQUE VALEROS MURIANA (KADHS6P8PY)"
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "Tack App Store"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        CODE_SIGN_ENTITLEMENTS: Tack/Tack.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: Tack/Tack.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.tack.shared

  # ─── macOS App ─────────────────────────────────────────────────
  TackMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tack
    info:
      path: TackMac/Info.plist
      properties:
        CFBundleDisplayName: Tack
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026"
        NSPrincipalClass: NSApplication
        NSMainStoryboardFile: ""
        # App is single-window SwiftUI lifecycle — no storyboard.
        NSUserActivityTypes:
          - AddTaskIntent
          - CompleteTaskIntent
          - QuickCaptureIntent
        # Permissions we'll explain in review notes
        NSDesktopFolderUsageDescription: "Tack needs to read the Obsidian vault you pick to keep your tasks in sync."
        NSDocumentsFolderUsageDescription: "Tack stores your tasks and the local SwiftData store inside your Documents folder."
        NSRemovableVolumesUsageDescription: "Tack reads and writes markdown files inside your chosen Obsidian vault."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tack.macos
        CODE_SIGN_ENTITLEMENTS: TackMac/TackMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        # macOS target runs as agent + GUI app
        LSUIElement: NO
    entitlements:
      path: TackMac/TackMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.app.tack.shared
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.files.downloads.read-write: false

  # ─── Widget Extension (iOS only) ──────────────────────────────
  TackWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TackWidget
      - path: Tack/Models
    info:
      path: TackWidget/Info.plist
      properties:
        CFBundleDisplayName: Tack
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tack.ios.widget
        "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution: ENRIQUE VALEROS MURIANA (KADHS6P8PY)"
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "Tack Widget App Store"
        CODE_SIGN_ENTITLEMENTS: TackWidget/TackWidget.entitlements
        SKIP_INSTALL: YES
    entitlements:
      path: TackWidget/TackWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.tack.shared

  # ─── UI Tests ──────────────────────────────────────────────────
  TackUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TackUITests
    dependencies:
      - target: Tack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tack.ios.uitests
        TEST_TARGET_NAME: Tack
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Tack:
    build:
      targets:
        Tack: all
        TackWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TackUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  TackMac:
    build:
      targets:
        TackMac: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

# Note: Native macOS target shares Tack/ sources with the iOS app via
# `#if os(macOS)` branches throughout (RootView, ObsidianSettingsView).
# Widget extension stays iOS-only — macOS Notification Center widgets are
# tracked for v1.1.
